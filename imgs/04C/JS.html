<style>
  html {
    background: white;
    font-family: "myriad pro", sans-serif;
    overflow: hidden;
  }

  body {
    margin: 0;
  }

  #container {
    position: absolute;
    box-sizing: border-box;
    left: 7.5%;
    top: 7%;

    width: 85%;
    height: 75%;

    border-color: black;
    border-width: 2px;
    border-style: none none solid solid;

    display: flex;
    flex-direction: row;

    justify-content: space-evenly;
    align-items: end;
  }

  #container div {
    width: 20%;
    height: var(--height, 50%);

    background: #5e81b5;
    outline: 1px solid black;

    transition: .5s;
  }


  #container.highlight div {
    --color: darkgray;
    background: var(--color);
  }
  #container.highlight div.high {
    --color: orange;
  }
  #container.highlight div.low {
    --color: darkslategray;
  }
 
  #buttons {
    position: absolute;
    width: 100%;
    bottom: 0;
    height: 2rem;

    -webkit-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  #buttons span {
    display: block;
    position: absolute;
    translate: 0 -50%;

    width: 40%;
    top: 50%;

    text-align: center;
    line-height: 1.5;
    font-weight: 500;
    padding: 1px 0;

    border-radius: 3px;

    --highlight-color: darkslategray;
    background: color-mix(in lab, var(--highlight-color), slategray);
    color: white;
    cursor: pointer;

    transition: background-color .1s;
  }

  #buttons span:first-child {
    left: 7%;
  }
  #buttons span:last-child {
    right: 7%;
  }

  #buttons span:hover {
    --highlight-color: lightgray;
  }

  #buttons span:active {
    --highlight-color: darkslategray;
    padding: 2px 0 0;
  }
 </style>
<html>
  <div id="container">
    <div style="--height: 60%"></div>
    <div style="--height: 80%"></div>
    <div style="--height: 20%"></div>
    <div style="--height: 50%"></div>
  </div>
  <div id="buttons">
    <span onclick="randomize()">Данные</span>
    <span onclick="window.container.classList.toggle('highlight')">Акцент</span>
  </div>
  <script>
    const columnLs = document.querySelectorAll("#container div");
    function randomize() {
      let min = Infinity, max = -Infinity;
      columnLs.forEach(L => {
        L.val = 100 * Math.random();
        min = Math.min(L.val, min);
        max = Math.max(L.val, max);
        L.style.setProperty("--height", `${L.val}%`);
      });
      columnLs.forEach(L => {
        if (L.val === min) {
          L.classList.add("low");
        } else {
          L.classList.remove("low");
        }
        if (L.val === max) {
          L.classList.add("high");
        } else {
          L.classList.remove("high");
        }
      });
    }
    randomize();
  </script>
</html>
